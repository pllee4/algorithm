stages:
  - build
  - deploy

focal-build:
  stage: build
  image: pllee4/ubuntu-ci:20.04
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  before_script:
    - apt-get install -y libeigen3-dev
  script:
    - mkdir build && cd build
    - cmake .. 
    - cmake --build .

focal-staging:
  stage: deploy
  only:    
    - master
  image: pllee4/ubuntu-ci:20.04
  variables:
    GIT_SUBMODULE_STRATEGY: recursive
  before_script:
    - apt-get install -y libeigen3-dev
    # Conan 2 only works with the project-level registry, not the instance-level one
    - conan remote add gitlab ${CI_API_V4_URL}/projects/${CI_PROJECT_ID}/packages/conan
  script:
    # build conan package
    - conan profile detect
    - conan create . --user=pinloon+public+algorithm --channel=devel --build=missing
    - CONAN_LOGIN_USERNAME=ci_user CONAN_PASSWORD=${CI_JOB_TOKEN} conan upload "algorithm/*@pinloon+public+algorithm/devel" --remote=gitlab -c
  dependencies:
    - focal-build